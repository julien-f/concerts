{{define "layout"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
{{block "meta" .}}{{end}}
<title>{{with .Notice}}{{.}} – {{end}}{{template "title" .}}</title>
<link rel="icon" href="{{static "icon.svg"}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{static "apple-touch-icon.png"}}">
<link rel="stylesheet" href="{{static "style.css"}}">
<script src="{{static "htmx-2.0.11.min.js"}}" defer></script>
</head>
<body>
{{template "icons"}}
<header class="top">
{{block "brand" .}}<a class="brand" href="{{.Base}}">{{.Group.Name}}</a>{{end}}
{{with .Me}}<form method="post" action="{{$.Base}}/logout" class="me">
<span>{{.Name}}</span>
<button class="link">Ce n'est pas moi</button>
</form>{{end}}
</header>
<main>
{{template "content" .}}
</main>
{{block "after" .}}{{end}}
</body>
</html>{{end}}
