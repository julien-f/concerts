<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concerts · maquettes</title>
<!-- Phase 0 only: two visual directions compared at 390 px; deleted when slice 2 applies the style. -->
<style>
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #ddd; color: #111; }
.compare { display: flex; flex-wrap: wrap; gap: 24px; padding: 16px; justify-content: center; }
.phone { width: 390px; min-height: 760px; position: relative; overflow: hidden; border-radius: 12px; }
.compare > h1 { width: 100%; text-align: center; font-size: 1rem; margin: 0; }
.label { font: 600 0.8rem/1 system-ui; text-transform: uppercase; letter-spacing: .1em; margin: 0 0 6px; }
svg { width: 18px; height: 18px; flex: none; }
button { font: inherit; }

/* ---------- A. Billet (ticket stub) ---------- */
.ticket { --bg: #f4efe6; --paper: #fffdf8; --ink: #1f1a17; --muted: #6b625a; --accent: #b4361d; --line: #d9cfc2; --on: #1f1a17; --on-fg: #fffdf8;
  background: var(--bg); color: var(--ink); padding: 12px 16px 96px; }
.ticket.dark { --bg: #17140f; --paper: #24201a; --ink: #f1ebe1; --muted: #b3a999; --accent: #ff8a65; --line: #3f382e; --on: #f1ebe1; --on-fg: #17140f; }
.ticket header { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0 8px; }
.ticket header h2 { font-size: 1.25rem; margin: 0; }
.ticket header a { color: var(--muted); font-size: .875rem; }
.ticket .filters { display: flex; gap: 8px; margin: 4px 0 12px; }
.ticket .filters a { padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: .9rem; }
.ticket .filters a[aria-current] { background: var(--on); color: var(--on-fg); border-color: var(--on); }
.ticket h3 { font: 700 .8rem/1 ui-monospace, monospace; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin: 18px 0 8px; }
.stub { display: grid; grid-template-columns: 64px 1fr; background: var(--paper); border-radius: 10px; margin-bottom: 12px;
  box-shadow: 0 1px 0 var(--line); position: relative; }
.stub .when { border-right: 2px dashed var(--line); text-align: center; padding: 12px 4px; font-family: ui-monospace, monospace; }
.stub .when b { display: block; font-size: 1.6rem; line-height: 1; }
.stub .when span { font-size: .75rem; text-transform: uppercase; color: var(--muted); }
.stub::before, .stub::after { content: ""; position: absolute; left: 55px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); }
.stub::before { top: -8px; } .stub::after { bottom: -8px; }
.stub .body { padding: 12px; min-width: 0; }
.stub .artist { font-weight: 700; font-size: 1.1rem; margin: 0; }
.stub .meta { color: var(--muted); font-size: .875rem; margin: 2px 0 8px; }
.stub .who { font-size: .875rem; margin: 0 0 10px; display: grid; gap: 2px; }
.stub .who span { display: flex; gap: 6px; align-items: center; }
.stub .mine { display: flex; gap: 6px; }
.stub .mine button { flex: 1; min-height: 44px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px;
  display: flex; align-items: center; justify-content: center; gap: 4px; font-size: .8rem; padding: 0 4px; }
.stub .mine button[aria-pressed="true"] { background: var(--on); color: var(--on-fg); border-color: var(--on); }
.ticket .add { position: absolute; left: 16px; right: 16px; bottom: 16px; min-height: 52px; border: 0; border-radius: 12px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 1rem; }
.ticket.dark .add { color: #17140f; }

/* ---------- B. Affiche (gig poster) ---------- */
.poster { --bg: #fff; --ink: #000; --hi: #ffe14d; --muted: #444; background: var(--bg); color: var(--ink); padding: 12px 16px 96px; }
.poster.dark { --bg: #000; --ink: #fff; --hi: #ffe14d; --muted: #bbb; }
.poster header h2 { font: 900 2rem/0.95 system-ui; text-transform: uppercase; letter-spacing: -.02em; margin: 4px 0 12px; }
.poster h3 { background: var(--ink); color: var(--bg); font: 900 1rem/1 system-ui; text-transform: uppercase; padding: 6px 8px; margin: 16px 0 0; }
.gig { border-bottom: 3px solid var(--ink); padding: 12px 0; }
.gig .date { display: inline-block; background: var(--hi); color: #000; font: 800 .85rem/1 system-ui; text-transform: uppercase; padding: 4px 6px; }
.gig .artist { font: 900 1.6rem/1 system-ui; text-transform: uppercase; margin: 6px 0 2px; letter-spacing: -.02em; }
.gig .meta { color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.gig .who { font-size: .875rem; margin: 0 0 8px; }
.gig .mine { display: flex; gap: 0; }
.gig .mine button { flex: 1; min-height: 44px; border: 2px solid var(--ink); margin-left: -2px; background: var(--bg); color: var(--ink);
  font-weight: 800; font-size: .75rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 4px; }
.gig .mine button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.poster .add { position: absolute; left: 16px; right: 16px; bottom: 16px; min-height: 52px; border: 3px solid #000; background: var(--hi); color: #000;
  font: 900 1.1rem/1 system-ui; text-transform: uppercase; }
</style>
</head>
<body>
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.3a.5.5 0 0 1 .9 0l2.3 4.7a2 2 0 0 0 1.5 1.1l5.2.8a.5.5 0 0 1 .3.9l-3.8 3.7a2 2 0 0 0-.6 1.8l.9 5.2a.5.5 0 0 1-.8.6l-4.6-2.5a2 2 0 0 0-1.9 0l-4.6 2.5a.5.5 0 0 1-.8-.6l.9-5.2a2 2 0 0 0-.6-1.8L2.3 9.8a.5.5 0 0 1 .3-.9l5.2-.8a2 2 0 0 0 1.5-1.1z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/></symbol>
</svg>
<div class="compare">
<h1>A. Billet — B. Affiche (clair puis sombre)</h1>

<template id="ticket-body">
  <header><h2>Les copains du concert</h2><a href="#">Julien · Ce n'est pas moi</a></header>
  <nav class="filters"><a href="#" aria-current="page">Tous</a><a href="#">Mes concerts</a></nav>
  <h3>Mars 2027</h3>
  <article class="stub">
    <div class="when"><span>sam.</span><b>14</b><span>mars</span></div>
    <div class="body">
      <p class="artist">Fontaines D.C.</p>
      <p class="meta">20 h · Zénith Paris</p>
      <p class="who"><span><svg aria-hidden="true"><use href="#i-ticket"/></svg>Billet : Léa, Marc</span><span><svg aria-hidden="true"><use href="#i-star"/></svg>Intéressés : Sam</span></p>
      <div class="mine"><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-star"/></svg>Intéressé</button><button aria-pressed="true"><svg aria-hidden="true"><use href="#i-check"/></svg>J'y vais</button><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-ticket"/></svg>Billet</button></div>
    </div>
  </article>
  <article class="stub">
    <div class="when"><span>ven.</span><b>27</b><span>mars</span></div>
    <div class="body">
      <p class="artist">Yuksek</p>
      <p class="meta">La Cigale · ajouté par Marc</p>
      <div class="mine"><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-star"/></svg>Intéressé</button><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-check"/></svg>J'y vais</button><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-ticket"/></svg>Billet</button></div>
    </div>
  </article>
  <button class="add">+ Ajouter un concert</button>
</template>

<template id="poster-body">
  <header><h2>Les copains du concert</h2></header>
  <h3>Mars 2027</h3>
  <article class="gig">
    <span class="date">sam. 14 mars · 20 h</span>
    <p class="artist">Fontaines D.C.</p>
    <p class="meta">Zénith Paris</p>
    <p class="who">🎟 Billet : Léa, Marc — ★ Intéressés : Sam</p>
    <div class="mine"><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-star"/></svg>Intéressé</button><button aria-pressed="true"><svg aria-hidden="true"><use href="#i-check"/></svg>J'y vais</button><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-ticket"/></svg>Billet</button></div>
  </article>
  <article class="gig">
    <span class="date">ven. 27 mars</span>
    <p class="artist">Yuksek</p>
    <p class="meta">La Cigale · ajouté par Marc</p>
    <div class="mine"><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-star"/></svg>Intéressé</button><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-check"/></svg>J'y vais</button><button aria-pressed="false"><svg aria-hidden="true"><use href="#i-ticket"/></svg>Billet</button></div>
  </article>
  <button class="add">+ Ajouter</button>
</template>

<section class="phone ticket" aria-label="A clair"></section>
<section class="phone ticket dark" aria-label="A sombre"></section>
<section class="phone poster" aria-label="B clair"></section>
<section class="phone poster dark" aria-label="B sombre"></section>
</div>
<script>
for (const [sel, tpl] of [[".ticket", "ticket-body"], [".poster", "poster-body"]])
  for (const el of document.querySelectorAll(sel)) el.append(document.getElementById(tpl).content.cloneNode(true));
</script>
</body>
</html>
